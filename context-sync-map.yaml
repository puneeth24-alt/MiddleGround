risks:
  - risk: MapLibre demotiles are basic.
    mitigation: The user may need to switch to MapTiler or Protomaps for production-grade tiles.
  - risk: Geoapify rate limits.
    mitigation: Implement Upstash Redis limits for the proxy.
  - risk: Middleware protects pages but not every API path equally.
    mitigation: Keep route handlers checking sessions where owner access is required.

