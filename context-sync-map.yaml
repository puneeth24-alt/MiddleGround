known_issues:
  - issue: .env.local.example is missing from the working tree according to git status.
    impact: README references copying it, but the file is currently absent.
    suggested_fix: Recreate .env.local.example or decide whether the local .env.local should be the only env reference.
  - issue: npm audit reported 9 vulnerabilities during install, including 1 high severity.
    impact: Dependency risk needs review before production deployment.
    suggested_fix: Run npm audit, inspect affected packages, and avoid blind npm audit fix --force unless breaking changes are acceptable.
  - issue: SSE event endpoint currently polls updatedAt.
    impact: Works for MVP but is not an efficient production event bus.
    suggested_fix: Use Supabase Realtime subscriptions.
  - issue: Rate limiting is not implemented.
    impact: Geoapify and location endpoints are not protected against abuse.
    suggested_fix: Add Upstash Redis/ratelimit or equivalent.

constraints:
