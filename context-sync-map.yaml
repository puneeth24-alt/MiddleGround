important_decisions:
  - decision: MapLibre GL for rendering.
    rationale: Eliminates the need for proprietary Mapbox licensing.
  - decision: Geoapify for both geocoding and places.
    rationale: Consolidates location APIs under a single service provider.
  - decision: Supabase client over Drizzle ORM.
    rationale: User requested simple Supabase storage over a complex Drizzle ORM setup for easier mapping.
  - decision: Use NextAuth credentials provider with bcryptjs.
    rationale: Allows local user registration and sign-in directly using Supabase table records.
  - decision: Keep API routes service-oriented and validation-focused.
    rationale: Minimizes coupling between UI, route handlers, and persistence implementation.

