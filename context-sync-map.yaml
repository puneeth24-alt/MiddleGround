project_goal:
  name: MiddleGround
  summary: >
    Build a collaborative meeting-point planner where an owner creates a shareable
    plan, participants add locations, the app calculates the geographic midpoint,
    and nearby cafes, restaurants, and pubs are suggested around that midpoint.
  source_architecture: C:\Users\R J Surya Prakash\Downloads\middleground-architecture.md
  current_target: Locally runnable MVP and Vercel-ready production architecture.

architecture:
  framework: Next.js App Router with TypeScript and React.
  styling: Tailwind CSS plus small global CSS for map markers.
  auth:
    library: NextAuth v4.
    implemented_providers:
      - Optional GitHub provider when OAuth env vars are configured.
      - Optional Google provider when OAuth env vars are configured.
      - Credentials provider using bcryptjs for secure password hashing.
  persistence:
    current: Supabase PostgreSQL database via @supabase/supabase-js.
    production_path: Supabase is fully configured for production deployment.
  domain_layers:
    services:
      - PlanService owns plans, participants, locations, midpoint, owner moderation, and caps (backed by Supabase).
      - PlacesService owns Geoapify calls, local fallback places, normalization, and LRU caching.
      - LocationService (now unified under Geoapify and MapLibre helpers).
      - AuthService owns Supabase user authentication and registration logic.
    api_routes: Thin validation and orchestration around services.
    ui: App Router pages compose client components, React Query hooks, and service-backed APIs.
  maps_and_places:
    maplibre: Rendering map tiles using open-source MapLibre GL JS (configured with demotiles).
    geoapify_places: Used for both geocoding (search) and nearby places retrieval.
    local_places_fallback: Deterministic mock venue suggestions used when Geoapify key is absent.
  realtime:
    current: SSE-shaped polling stream at /api/plans/[id]/events that emits plan change events.
    production_recommendation: Replace polling internals with Supabase Realtime subscriptions.

repository_structure:
  app:
    purpose: Next.js routes, API route handlers, layouts, and providers.
    notable_routes:
      - /login
      - /dashboard
      - /plans/[id]
      - /join/[token]
      - /api/plans
      - /api/plans/[id]
      - /api/plans/[id]/locations
      - /api/plans/[id]/locations/[locId]
      - /api/plans/[id]/midpoint
      - /api/plans/[id]/events
      - /api/places
      - /api/join/[token]
      - /api/auth/[...nextauth]
      - /api/auth/register
  components:
    purpose: Client UI split by feature.
    groups:
      - auth
      - dashboard
      - join
      - map
      - places
      - plan
      - ui
  hooks:
    purpose: React Query and derived client hooks.
  lib:
    purpose: Auth options/session helpers, env validation, HTTP helpers, Supabase client.
  services:
    purpose: Framework-light business logic.
  types:
    purpose: Shared TypeScript DTOs and module augmentation.
  utils:
    purpose: Geo math, formatting, token generation, and avatar color helpers.

