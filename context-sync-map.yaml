  network: Network access is restricted and package downloads may require approval.
  secrets: Do not commit .env.local or real API credentials.
  production_credentials_needed:
    - NEXTAUTH_SECRET
    - NEXTAUTH_URL
    - NEXT_PUBLIC_SUPABASE_URL
    - SUPABASE_SERVICE_ROLE_KEY
    - GEOAPIFY_API_KEY
    - AUTH_GITHUB_ID and AUTH_GITHUB_SECRET if GitHub OAuth is used
    - AUTH_GOOGLE_ID and AUTH_GOOGLE_SECRET if Google OAuth is used

